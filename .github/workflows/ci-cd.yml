name: Food Delivery Platform CI/CD Pipeline

on:
  push:
    branches: [ main, develop]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # 🧱 1️⃣ Build
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend Build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js application
        run: pnpm build
        continue-on-error: true
        env:
          NODE_ENV: production

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            public/
          retention-days: 7

      # Backend Build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify project structure
        run: |
          echo "Backend files:"
          ls -la backend/
          echo "Test files:"
          ls -la backend/tests/

      - name: Generate build summary
        run: |
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "✅ Frontend build completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend dependencies installed" >> $GITHUB_STEP_SUMMARY


  # 🧪 2️⃣ Test
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build  # <-- FIXED
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend Tests
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify test files exist
        id: check-tests
        run: |
          echo "Checking for test files..."
          if [ ! -d "backend/tests" ]; then
            echo "HAS_TESTS=false" >> $GITHUB_OUTPUT
            echo "UNIT_COUNT=0" >> $GITHUB_OUTPUT
            echo "INTEGRATION_COUNT=0" >> $GITHUB_OUTPUT
            echo "SYSTEM_COUNT=0" >> $GITHUB_OUTPUT
          else
            UNIT_TESTS=$(find backend/tests/unit -name "test_*.py" 2>/dev/null | wc -l || echo "0")
            INTEGRATION_TESTS=$(find backend/tests/integration -name "test_*.py" 2>/dev/null | wc -l || echo "0")
            SYSTEM_TESTS=$(find backend/tests/system -name "test_*.py" 2>/dev/null | wc -l || echo "0")
            
            echo "UNIT_COUNT=$UNIT_TESTS" >> $GITHUB_OUTPUT
            echo "INTEGRATION_COUNT=$INTEGRATION_TESTS" >> $GITHUB_OUTPUT
            echo "SYSTEM_COUNT=$SYSTEM_TESTS" >> $GITHUB_OUTPUT
            
            if [ "$UNIT_TESTS" -gt 0 ] || [ "$INTEGRATION_TESTS" -gt 0 ] || [ "$SYSTEM_TESTS" -gt 0 ]; then
              echo "HAS_TESTS=true" >> $GITHUB_OUTPUT
            else
              echo "HAS_TESTS=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run unit tests
        if: steps.check-tests.outputs.HAS_TESTS == 'true'
        working-directory: ./backend
        run: |
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name 'test_*.py')" ]; then
            pytest tests/unit/ -v --tb=short --asyncio-mode=auto
          fi

      - name: Run integration tests
        if: steps.check-tests.outputs.HAS_TESTS == 'true'
        working-directory: ./backend
        run: |
          if [ -d "tests/integration" ] && [ -n "$(find tests/integration -name 'test_*.py')" ]; then
            pytest tests/integration/ -v --tb=short --asyncio-mode=auto
          fi

      - name: Run system tests
        if: steps.check-tests.outputs.HAS_TESTS == 'true'
        working-directory: ./backend
        run: |
          if [ -d "tests/system" ] && [ -n "$(find tests/system -name 'test_*.py')" ]; then
            pytest tests/system/ -v --tb=short --asyncio-mode=auto
          fi

      - name: Generate test summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Unit: ${{ steps.check-tests.outputs.UNIT_COUNT }}" >> $GITHUB_STEP_SUMMARY
          echo "Integration: ${{ steps.check-tests.outputs.INTEGRATION_COUNT }}" >> $GITHUB_STEP_SUMMARY
          echo "System: ${{ steps.check-tests.outputs.SYSTEM_COUNT }}" >> $GITHUB_STEP_SUMMARY


  # 📊 3️⃣ Coverage
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test  # <-- FIXED
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for test files
        id: check-tests
        run: |
          if [ -z "$(find backend/tests -name 'test_*.py' -o -name '*_test.py')" ]; then
            echo "HAS_TESTS=false" >> $GITHUB_OUTPUT
          else
            echo "HAS_TESTS=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate backend coverage report
        if: steps.check-tests.outputs.HAS_TESTS == 'true'
        working-directory: ./backend
        run: |
          mkdir -p ../reports/coverage ../reports/junit
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html:../reports/coverage/html \
            --cov-report=xml:../reports/coverage/coverage.xml \
            --junitxml=../reports/junit/test-results.xml \
            --asyncio-mode=auto \
            --import-mode=append

      - name: Upload coverage artifacts
        if: steps.check-tests.outputs.HAS_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/


  # 🧹 4️⃣ Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: coverage  # <-- FIXED
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install linting tools
        run: |
          pip install flake8 pylint black isort mypy

      - name: Run flake8
        continue-on-error: true
        run: flake8 backend/ --max-line-length=120 --extend-ignore=E501,W503,E402

      - name: Run pylint
        continue-on-error: true
        run: pylint backend/ --disable=C0111,R0903,C0103,E0401,W0611

      - name: Check black
        continue-on-error: true
        run: black --check backend/

      - name: Check isort
        continue-on-error: true
        run: isort --check-only --profile black backend/


  # 🛡️ 5️⃣ Security
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint  # <-- FIXED
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend Security
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # Backend Security
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install security tools
        run: |
          pip install safety bandit

      - name: Run safety
        continue-on-error: true
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          safety check --json > ../safety-report.json || true

      - name: Run bandit
        continue-on-error: true
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json


  # 📦 6️⃣ Deployment
  deployment-artifact:
    name: Deployment Artifact
    runs-on: ubuntu-latest
    needs: [test, coverage, lint, security]  # <-- FIXED
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: build-output

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-reports
        continue-on-error: true

      - name: Download security artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: security-reports
        continue-on-error: true

      - name: Create deployment package
        run: |
          mkdir -p deployment_package
          cp -r backend deployment_package/
          cp -r build-output/.next deployment_package/ || true
          cp -r build-output/public deployment_package/ || true
          cp README.md deployment_package/ || true
          tar -czf deployment_bundle.tar.gz deployment_package/

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: deployment_bundle.tar.gz
