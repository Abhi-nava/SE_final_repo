name: Backend Tests & CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      PYTHON_KEYRING_BACKEND: "keyring.backends.null.Keyring"
      MONGODB_URL: "mongodb://localhost:27017"
      DATABASE_NAME: "foodhub_test_ci"
      SECRET_KEY: "test-secret-key-for-ci"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # dev/test extras if you have them
          pip install pytest pytest-asyncio httpx motor pymongo pytest-mock

      - name: Wait for Mongo
        run: |
          for i in `seq 1 30`; do
            mongosh --eval "db.adminCommand('ping')" && break || sleep 1
          done

      - name: Run unit tests (fast, mocked)
        run: |
          pytest -q backend/tests/unit -o log_cli=true
        continue-on-error: false

      - name: Run integration tests (uses real MongoDB service)
        env:
          MONGODB_URL: ${{ env.MONGODB_URL }}
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
        run: |
          pytest -q backend/tests/integration -o log_cli=true