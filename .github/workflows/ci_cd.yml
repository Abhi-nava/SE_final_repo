name: Backend Utils Tests CI Pipeline

on:
  push:
    branches: [main, develop, tests, 'feature/*']
  pull_request:
    branches: [main, develop]

jobs:
  # 🧱 1️⃣ Build
  build:  
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify backend structure
        run: |
          echo "Backend files:"
          ls -la backend/
          echo "Test files:"
          ls -la tests/


  # 🧪 2️⃣ Test
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/unit/test_auth_routes.py \
                 tests/unit/test_security.py \
                 tests/unit/test_dependencies.py \
                 -v --tb=short

      - name: Run integration tests
        run: |
          pytest tests/integration/test_auth_integration.py \
                 tests/integration/test_security_integration.py \
                 tests/integration/test_dependencies_integration.py \
                 -v --tb=short

      - name: Run system tests
        run: |
          pytest tests/system/test_security_system.py \
                 tests/system/test_dependencies_system.py \
                 -v --tb=short

      - name: Generate test summary
        if: always()
        run: |
          echo "### Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Unit Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/unit/test_auth_routes.py \
                 tests/unit/test_security.py \
                 tests/unit/test_dependencies.py \
                 -v --tb=no || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Integration Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/integration/test_auth_integration.py \
                 tests/integration/test_security_integration.py \
                 tests/integration/test_dependencies_integration.py \
                 -v --tb=no || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### System Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/system/test_security_system.py \
                 tests/system/test_dependencies_system.py \
                 -v --tb=no || true


  # 📊 3️⃣ Coverage
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Generate coverage report
        run: |
          pytest tests/unit/test_auth_routes.py \
                 tests/unit/test_security.py \
                 tests/unit/test_dependencies.py \
                 tests/integration/test_auth_integration.py \
                 tests/integration/test_security_integration.py \
                 tests/integration/test_dependencies_integration.py \
                 tests/system/test_security_system.py \
                 tests/system/test_dependencies_system.py \
                 --cov=backend/utils/security \
                 --cov=backend/utils/dependencies \
                 --cov=backend/routes/auth \
                 --cov-report=term-missing \
                 --cov-report=html \
                 --cov-report=xml

      - name: Display coverage summary
        run: |
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pytest tests/unit/test_auth_routes.py \
                 tests/unit/test_security.py \
                 tests/unit/test_dependencies.py \
                 tests/integration/test_auth_integration.py \
                 tests/integration/test_security_integration.py \
                 tests/integration/test_dependencies_integration.py \
                 tests/system/test_security_system.py \
                 tests/system/test_dependencies_system.py \
                 --cov=backend/utils/security \
                 --cov=backend/utils/dependencies \
                 --cov=backend/routes/auth \
                 --cov-report=term --tb=no || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: warn


  # 🧹 4️⃣ Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort mypy

      - name: Run flake8
        continue-on-error: true
        run: |
          flake8 backend/utils/security.py \
                 backend/utils/dependencies.py \
                 backend/routes/auth.py \
                 --max-line-length=120 \
                 --extend-ignore=E501,W503 || true

      - name: Run pylint
        continue-on-error: true
        run: |
          pylint backend/utils/security.py \
                 backend/utils/dependencies.py \
                 backend/routes/auth.py \
                 --disable=C0111,R0903,C0103 || true

      - name: Check code formatting with black
        continue-on-error: true
        run: |
          black --check backend/utils/security.py \
                       backend/utils/dependencies.py \
                       backend/routes/auth.py || true

      - name: Check import sorting with isort
        continue-on-error: true
        run: |
          isort --check-only backend/utils/security.py \
                             backend/utils/dependencies.py \
                             backend/routes/auth.py || true


  # 🛡️ 5️⃣ Security
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run safety check
        continue-on-error: true
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          safety check --json > ../safety-report.json || true

      - name: Run bandit security linter
        continue-on-error: true
        run: |
          bandit -r backend/utils/security.py \
                    backend/utils/dependencies.py \
                    backend/routes/auth.py \
                 -f json -o bandit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            safety-report.json
            bandit-report.json
          if-no-files-found: ignore


  # 📦 6️⃣ Deployment Artifact
  deployment-artifact:
    name: Deployment Artifact
    runs-on: ubuntu-latest
    needs: [test, coverage, lint, security]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected_artifacts

      - name: Create deployment package
        run: |
          mkdir -p deployment_package
          
          # Backend code
          cp -r backend deployment_package/
          
          # Test reports
          cp -r collected_artifacts deployment_package/reports || true
          
          # Documentation
          cp README.md deployment_package/ || true
          
          # Create archive
          cd deployment_package && zip -r ../deployment_bundle.zip . && cd -

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: deployment_bundle.zip
          if-no-files-found: warn